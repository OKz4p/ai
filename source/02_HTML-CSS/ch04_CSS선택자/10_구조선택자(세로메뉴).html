<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div#nav {
            width: 200px;
            margin: 0px auto;
        }

        #nav ul {
            overflow: hidden;
        }
            /*부모단*/
            #nav ul li {
                float: left;
                list-style: none;
                border: 1px solid gray;
                padding: 10px 30px;
                margin: 2px;
                font-size: 1.3em; /*글씨크기를 1.3배*/
                text-align:center;
                font-weight:bold;
            }

        #nav li > a {
            color: black;
            text-decoration: none;
        }

        #nav li:nth-child(2n) { /*#nav 밑의 짝수번째 li*/
            background-color: yellow;
        }

        #nav li:nth-child(2n+1) { /*홀수번째 li*/
            background-color: orange;
        }

        #nav li:first-child { /*nav 아래의 첫번째 li*/
            border-radius: 20px 20px 0 0; /* 시계방향으로 좌상 우상 우하 좌하*/
        }

        #nav li:last-child { /*nav 아래의 첫번째 li*/
            border-radius: 0 0 20px 20px; /* 시계방향으로 좌상 우상 우하 좌하*/
        }
    </style>
</head>
<body>
    <div id="nav">
        <ul>
            <li><a href="#">menu1</a></li>
            <li><a href="#">menu2</a></li>
            <li><a href="#">menu3</a></li>
            <li><a href="#">menu4</a></li>
            <li><a href="#">menu5</a></li>
            <li><a href="#">menu6</a></li>
            <li><a href="#">menu7</a></li>
            <li><a href="#">menu8</a></li>
        </ul>
    </div>
</body>
</html>
