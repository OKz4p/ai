<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        *{
            margin: 0; padding: 0;
        }
        body{
            background-color: #ea8f00;
        }
        #showHide{
            width: 200px; height: 100px;
            background-color: red;
            display: none;
        }
        #toggle:checked ~ #showhide {display: block;}
        #toggle{display: none;}
    </style>
</head>
<body>
    <input type="checkbox" id="toggle">
    <p>중간에 내용이 많아도 상관없음</p><!--shift+alt+화살표:복사/alt+화살표:이동-->
    <label for="toggle">
        <img src="ch07/menu.png" alt="메뉴">
    </label>
    <p>중간에 내용이 많아도 상관없음</p> 
    <div id="showHide">토글부분(메뉴가나타났다 사라졌다 나타났다 ...)</div>
</body>
</html>
