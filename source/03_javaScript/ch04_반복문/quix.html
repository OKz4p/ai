<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        let cnt = 0;
        let total = 0;
        let rightCnt = 0;
        let flaseCnt = 0;

        while(confirm("누적할래?")){
            while(true){
                let scoreInput = prompt("누적할 점수는?");
                if(scoreInput === null){
                    break;
                }
                let score = Number(scoreInput);
                cnt++;

                if(scoreInput.trim() !=="" && !isNaN(score) && score>=0 && score <= 100){
                    total += score;
                    rightCnt++;
                }else{
                    flaseCnt++;
                    }
                }
                break;}
            
        document.write(`${cnt}번 입력<br> 
                        누적점수:${total}<br> 
                        점수를 제대로 입력한 회수:${rightCnt}<br>
                        점수를 잘못 입력한 횟수:${flaseCnt}`);
    </script>
</head>
<body>
</body>
</html>
